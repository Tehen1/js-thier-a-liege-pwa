name: Astro quality gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Astro quality and HTTP smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install pinned pnpm
        run: npm install --global --no-audit --no-fund pnpm@12.14.0

      - name: Reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify types, ESLint, tests and Astro build
        shell: bash
        run: |
          set -euo pipefail
          build_log="$(mktemp)"
          trap 'rm -f "$build_log"' EXIT
          pnpm run check 2>&1 | tee "$build_log"
          if grep -Eq '\[UNRESOLVED_IMPORT\]|Module not found, treating it as an external dependency' "$build_log"; then
            echo "::error::Unresolved import in the PWA build. Check Workbox hoisting." >&2
            exit 1
          fi

      - name: Static preview HTTP smoke test
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec astro preview --host 127.0.0.1 --port 3210 > /tmp/jsthier-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3210/; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [[ "$ready" != "1" ]]; then
            cat /tmp/jsthier-preview.log
            exit 1
          fi

          for route in / /manifest.webmanifest /sw.js /icons/icon-192.png /icons/icon-512.png /images/crest.svg /game.js /runner.js /app.js /theme-init.js; do
            curl --fail --silent --show-error --output /dev/null "http://127.0.0.1:3210$route"
          done

          # The page must ship as static HTML with no Next runtime left.
          html=$(curl --fail --silent http://127.0.0.1:3210/)
          if ! grep -q '/_astro/' <<<"$html"; then
            echo "Built page does not reference any /_astro/ asset" >&2
            exit 1
          fi
          if grep -q '/_next/' <<<"$html"; then
            echo "Built page still references the Next.js runtime" >&2
            exit 1
          fi

      - name: Mobile Chrome runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || true)"
          if [[ -z "$chrome" ]]; then
            echo "::error::Chrome is required to validate the mobile JavaScript runtime" >&2
            exit 1
          fi
          browser_profile="$(mktemp -d)"
          browser_dom="$(mktemp)"
          browser_log="$(mktemp)"
          pnpm exec astro preview --host 127.0.0.1 --port 3211 > /tmp/jsthier-browser-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; rm -rf "$browser_profile"; rm -f "$browser_dom" "$browser_log"' EXIT
          ready=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3211/; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [[ "$ready" != "1" ]]; then
            cat /tmp/jsthier-browser-preview.log
            exit 1
          fi
          "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --disable-extensions --no-first-run --user-data-dir="$browser_profile" \
            --window-size=591,685 --virtual-time-budget=4500 --dump-dom \
            http://127.0.0.1:3211/ > "$browser_dom" 2> "$browser_log" || {
            cat "$browser_log" >&2
            exit 1
          }
          node scripts/check-browser-dom.mjs "$browser_dom"
