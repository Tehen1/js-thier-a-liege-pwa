name: Next.js quality gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Next.js quality and HTTP smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Install pinned pnpm
        run: npm install --global --no-audit --no-fund pnpm@12.14.0

      - name: Reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify TypeScript, ESLint, tests and Next.js build
        run: pnpm exec turbo run build --concurrency=2

      - name: Verify PWA assets
        run: node --test tests/pwa-assets.test.mjs

      - name: Production server HTTP smoke test
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec next start --hostname 127.0.0.1 --port 3210 > /tmp/jsthier-next-start.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3210/; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [[ "$ready" != "1" ]]; then
            cat /tmp/jsthier-next-start.log
            exit 1
          fi
          for route in / /manifest.webmanifest /sw.js /icons/icon-192.png /icons/icon-512.png /images/crest.svg /game.js /runner.js; do
            curl --fail --silent --show-error --output /dev/null "http://127.0.0.1:3210$route"
          done
