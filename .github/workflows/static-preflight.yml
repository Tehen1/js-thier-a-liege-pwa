name: Static PWA preflight

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-preflight:
    name: Static preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Check JavaScript syntax
        run: |
          set -eu
          for file in app.js board.js game.js runner.js theme-init.js theme.js sw.js export.js src-bundle.js; do
            node --check "$file"
          done

      - name: Validate static site and PWA assets
        run: node --test tests/static-integrity.test.mjs
