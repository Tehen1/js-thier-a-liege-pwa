name: Regenerate pnpm lockfile (temporary)

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - fix/astro-middleware-node22-20261107

permissions:
  contents: read

jobs:
  regenerate:
    name: Produce reviewed pnpm lockfile diff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm install --global --no-audit --no-fund pnpm@12.14.0
      - name: Generate lockfile for review (no push)
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --lockfile-only --ignore-scripts
          echo 'LOCKFILE_DIFF_BEGIN'
          git diff --no-ext-diff -- pnpm-lock.yaml
          echo 'LOCKFILE_DIFF_END'
