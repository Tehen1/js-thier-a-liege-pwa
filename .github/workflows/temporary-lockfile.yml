name: Commit pnpm lockfile (temporary)

on:
  push:
    branches:
      - fix/astro-middleware-node22-20261107

permissions:
  contents: write

jobs:
  regenerate:
    if: github.repository == 'Tehen1/js-thier-a-liege-pwa' && github.ref == 'refs/heads/fix/astro-middleware-node22-20261107'
    name: Install pinned Turbo and commit lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the corrective branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install pinned pnpm
        run: npm install --global --no-audit --no-fund pnpm@12.14.0
      - name: Regenerate and commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          pnpm add --save-dev --workspace-root --save-exact turbo@2.11.10 --ignore-scripts
          git diff --check
          git add package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No lockfile change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: réinstaller turbo pour les tâches Vercel CI"
          git push origin HEAD:fix/astro-middleware-node22-20261107
